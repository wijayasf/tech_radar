[package]
name = "tech-radar-rust"
version = "0.1.0"
edition = "2024"

[dependencies]
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.12", features = ["json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
roxmltree = "0.20"
chrono = { version = "0.4", features = ["clock"] }
feed-rs = "2"
